# ─────────────────────────────────────────────────────────────────────────────
# Reference stack for Stitch Debt Recovery Pulse.
#
# This is a working starting point, not a mandate — devops owns the final
# orchestration. Both images are orchestrator-agnostic; only the wiring below
# is compose-specific. See DEPLOY.md.
#
# There is deliberately NO mysql service here: the dashboard connects to the
# existing production database.
# ─────────────────────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cgreen-dashboard-app:latest
    container_name: cgreen-dashboard-app
    restart: unless-stopped
    # All runtime configuration and secrets (DB_*, ZOHO_FLOW_WEBHOOK_SECRET, ...)
    # come from .env or the deployment environment — never from this file.
    env_file:
      - .env
    environment:
      # Pinned because the port mapping and the served frontend depend on them:
      # a different PORT in .env would leave the proxy pointing at a dead port
      # while the healthcheck (which reads PORT) still passes, and any NODE_ENV
      # other than production stops the server serving dist/.
      PORT: "3001"
      NODE_ENV: production
    ports:
      # Put this behind the reverse proxy (production:
      # https://collections.dashboard.cgreen.in → this port). The API sends
      # Access-Control-Allow-Origin: * on every route, so it should not be
      # exposed to the public internet directly.
      - "${APP_PORT:-3001}:3001"
    volumes:
      # Google Admin Directory OAuth client — read-only.
      - ./credentials1.json:/app/credentials1.json:ro
      # Rewritten by server.ts on every token refresh → MUST be writable by
      # uid 1000. On a Linux host: sudo chown 1000:1000 token1.json
      - ./token1.json:/app/token1.json
      # Optional: local employee photos, used in preference to the Google API.
      - employee-photos:/app/public/employee-photos
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/api/health').then(r=>r.json()).then(j=>process.exit(j.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  employee-photos:
